version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
      - ./logs/zookeeper:/var/log/zookeeper

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG4J_ROOT_LOGLEVEL: INFO
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./logs/kafka:/var/log/kafka
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  producer:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      # Volumen para desarrollo - tus cambios se reflejan inmediatamente
      - ./:/app
      # Excluir __pycache__ y otros archivos temporales
      - /app/__pycache__
      # Logs de Python
      - ./logs/producer:/app/logs
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PYTHONUNBUFFERED: 1
      LOG_FILE: /app/logs/producer.log
    command: python producer.py
    restart: on-failure

  consumer:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      # Volumen para desarrollo - tus cambios se reflejan inmediatamente
      - ./:/app
      # Excluir __pycache__ y otros archivos temporales
      - /app/__pycache__
      # Logs de Python
      - ./logs/consumer:/app/logs
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PYTHONUNBUFFERED: 1
      LOG_FILE: /app/logs/consumer.log
    command: python consumer.py
    restart: on-failure

  webapp:
    build: .
    depends_on:
      - consumer
    volumes:
      - ./:/app
      - ./logs:/app/logs
    ports:
      - "8501:8501"
    environment:
      PYTHONUNBUFFERED: 1
    command: streamlit run telemetria.py --server.port=8501 --server.address=0.0.0.0

volumes:
  zookeeper-data:
  zookeeper-logs:
  kafka-data: